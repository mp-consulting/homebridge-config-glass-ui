name: CI

# Pushes are only built on main. A branch with an open pull request would otherwise
# run the whole matrix twice: once for the push event and once for the pull_request.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      # The server and the React UI are two npm packages with their own lock files
      - name: Install dependencies
        run: npm ci && npm ci --prefix ui

      - name: Lint
        run: npm run lint

      - name: Typecheck UI
        run: npm run typecheck --prefix ui

      # Test code is compiled by SWC in vitest, which strips types without checking them
      - name: Typecheck tests
        run: npm run typecheck:test

      - name: Build
        run: npm run build

      # Coverage (and its thresholds in vitest.config.js / ui/vite.config.ts) is
      # checked on one Node version only, to keep the matrix fast
      - name: Test server
        if: matrix.node-version != '24.x'
        run: npm test

      - name: Test server (with coverage)
        if: matrix.node-version == '24.x'
        run: npm run test-coverage

      # The schema-form golden suite replays real plugin schemas, which are gitignored and
      # pinned by manifest.json. On CI the suite fails (rather than skips) when they are missing.
      - name: Cache schema corpus
        id: schema-corpus
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ui/src/schema-form/__corpus__/schemas
          key: schema-corpus-${{ hashFiles('ui/src/schema-form/__corpus__/manifest.json') }}

      - name: Fetch schema corpus
        if: steps.schema-corpus.outputs.cache-hit != 'true'
        run: node scripts/schema-corpus/fetch.mjs --from-manifest

      # Translators' report: keys still in English per locale and, on a pull request, the
      # new en.json keys it adds. It never fails the build (see scripts/i18n-report.ts).
      - name: Untranslated keys report
        if: matrix.node-version == '24.x'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          npm run --silent i18n:report
          if [ -n "$BASE_REF" ]; then
            git fetch --depth=1 origin "$BASE_REF"
            npm run --silent i18n:report -- --since FETCH_HEAD --keys
          fi

      - name: Test UI
        if: matrix.node-version != '24.x'
        run: npm run test:ui

      - name: Test UI (with coverage)
        if: matrix.node-version == '24.x'
        run: npm run test:ui -- --coverage

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Install dependencies
        run: npm ci && npm ci --prefix ui

      - name: Build UI for the e2e suite
        run: node e2e/build.mjs

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Also installs the system libraries chromium needs (not cached)
      - name: Install chromium
        run: npx playwright install --with-deps chromium

      # Real plugins with a custom settings UI, for custom-ui.spec.ts. The script copies the
      # mock plugins in too, so they are part of the key.
      - name: Cache e2e plugins
        id: e2e-plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: e2e/.run/plugins
          key: e2e-plugins-${{ hashFiles('e2e/install-plugins.mjs', 'test/mocks/plugins/**') }}

      - name: Install e2e plugins
        if: steps.e2e-plugins.outputs.cache-hit != 'true'
        run: node e2e/install-plugins.mjs

      # The visual specs run in the `visual` job below, inside the image their baselines come from
      - name: Run browser tests
        run: npx playwright test -c e2e --grep-invert visual --reporter=list,html
        env:
          # Seeds the 2FA user saves.spec.ts logs in with
          E2E_OTP_USER: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            playwright-report/
            e2e/test-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  visual:
    name: Visual (Playwright)
    runs-on: ubuntu-latest
    # The image the committed Linux baselines were recorded in: fonts and rendering only match
    # inside it. Keep the tag in step with @playwright/test in package.json (and the command in
    # the header of e2e/specs/visual.spec.ts); a bump means re-recording the baselines.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Cache npm downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: npm-playwright-image-${{ hashFiles('package-lock.json', 'ui/package-lock.json') }}

      - name: Install dependencies
        run: npm ci && npm ci --prefix ui

      - name: Build UI for the e2e suite
        run: node e2e/build.mjs

      # The plugin list the /plugins screenshots show includes these (see the e2e job)
      - name: Cache e2e plugins
        id: e2e-plugins
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: e2e/.run/plugins
          key: e2e-plugins-${{ hashFiles('e2e/install-plugins.mjs', 'test/mocks/plugins/**') }}

      - name: Install e2e plugins
        if: steps.e2e-plugins.outputs.cache-hit != 'true'
        run: node e2e/install-plugins.mjs

      # Strict: compares with e2e/specs/visual.spec.ts-snapshots/*-linux.png and never updates
      # them. To re-record after an intended change, run the docker command in the spec's header.
      - name: Run visual tests
        run: npx playwright test -c e2e visual.spec --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-visual-report
          path: |
            e2e/playwright-report/
            playwright-report/
            e2e/test-results/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
