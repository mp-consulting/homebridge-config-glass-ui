<app-sidebar [initialIsExpanded]="sidebarExpanded()" />
<div class="content px-3 p-md-4" [class.sidebarExpanded]="sidebarExpanded()">
  @if (sslStartupError(); as reason) {
    <div class="alert alert-warning" role="alert">
      <i class="fas fa-fw fa-triangle-exclamation me-1"></i>
      {{ 'layout.ssl_fallback_warning' | translate: { reason } }}
    </div>
  }
  <router-outlet />
</div>
